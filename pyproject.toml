[build-system]
requires = [
    "wheel", 
    "setuptools==72.1.0", 
]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-typing"
authors = [{name = "Liam", email = "liam_deburca@me.com"}]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic==2.12",
    "lazy-imports==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "isort==9.0.2",

    "astropy==7.0",
    "numpy==1.26",
    "scipy==1.16",
    "emcee==3.1.6",
    "pandas==3.0.5",
    "cachetools==7.0.5",
    "dynesty==3.0.0",
    "h5py==3.16.0",
]

[project.urls]
Homepage = "https://github.com/liamdeburca/quasar-typing"
Repository = "https://github.com/liamdeburca/quasar-typing.git"
"Bug Tracker" = "https://github.com/liamdeburca/quasar-typing/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 79

[lint.pyupgrade]
keep-runtime-typing = true